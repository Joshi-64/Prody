<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roots demo</title><link rel="stylesheet" href="/static/css/roots.css">
<style>body{margin:0;padding:24px;background:#efe6d6;font:14px Inter,sans-serif}[data-theme=dark] body{background:#120d0a;color:#eee}.wrap{max-width:880px;margin:0 auto}h3{margin:28px 0 10px;font-weight:600}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #0002;background:#fff;margin-right:6px}@media(max-width:500px){body{padding:10px}}</style></head>
<body><div class="wrap">
<div><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">Theme</button>
<button onclick="var e=document.querySelector('#live');roots.growLeaf(e,e._roots.data.branches[0].course_id)">growLeaf(first course)</button></div>
<h3>Your data (/roots/data)</h3><div class="roots" id="live" data-roots-src="/roots/data"></div>
<h3>Fixture: dashed roots, null weights, empty course</h3><div class="roots" id="fx"></div>
</div>
<script src="/static/js/roots.js"></script>
<script>
var t=new Date(),iso=function(n){var d=new Date(t);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
roots.mount(document.getElementById('fx'),{today:iso(0),streak:4,studied_today:35,branches:[
 {course_id:1,name:'Database Systems',code:'CSC 4710',color:'',minutes:540,leaves:9,flowers:2},
 {course_id:2,name:'Linear Algebra',code:'MATH 2420',color:'',minutes:360,leaves:6,flowers:1},
 {course_id:3,name:'Composition',code:'ENG 1020',color:'',minutes:0,leaves:0,flowers:0},
 {course_id:4,name:'Biology',code:'BIO 1510',color:'',minutes:3900,leaves:65,flowers:8}],roots:[
 {deadline_id:11,course_id:1,name:'Lab 3',due:iso(2),days_left:2,weight:5,studied_minutes:90,dashed:false},
 {deadline_id:12,course_id:2,name:'Midterm',due:iso(9),days_left:9,weight:30,studied_minutes:200,dashed:false},
 {deadline_id:13,course_id:3,name:'Essay draft',due:iso(17),days_left:17,weight:null,studied_minutes:0,dashed:true},
 {deadline_id:14,course_id:3,name:'Problem set 5',due:iso(25),days_left:25,weight:8,studied_minutes:0,dashed:true},
 {deadline_id:15,course_id:4,name:'Final project',due:iso(44),days_left:44,weight:40,studied_minutes:600,dashed:false}]});
document.addEventListener('roots:select',function(e){console.log('roots:select',JSON.stringify(e.detail))});
</script></body></html>
