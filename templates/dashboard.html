{% extends 'base.html' %}
{% block content %}
<div class="card">
  <p>
    <a href="{{ url_for('dashboard') }}">Dashboard</a> | 
    <a href="{{ url_for('calendar_bp.view_calendar') }}">My Calendar</a> | 
    <a href="{{ url_for('user_courses_bp.add_courses') }}">Add Courses/Deadlines</a> | 
    <a href="{{ url_for('tasks_bp.manage_tasks') }}">Tasks</a> | 
    <a href="{{ url_for('logout') }}">Log Out</a>
  </p>
  <hr>
  <h3>Welcome, {{ username }}</h3>
  <p><strong>Role:</strong> {{ role }}</p>
  <p>Your session is active. You can now access your courses and study tools.</p>
  <a href="{{ url_for('tasks_bp.manage_tasks') }}" style="display: inline-block; margin-top: 12px; padding: 10px 18px; background: #007bff; color: white; text-decoration: none; border-radius: 4px;">Open Tasks Tracker →</a>
</div>
{% endblock %}
