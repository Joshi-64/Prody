<!DOCTYPE html>
<html>
<head>
  <title>Prody - User Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 600px; line-height: 1.6; }
    .flash { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .danger { background: #f8d7da; color: #721c24; }
    .warning { background: #fff3cd; color: #856404; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 6px; }
    input, select { display: block; width: 100%; margin: 8px 0 16px; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 18px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    nav a { margin-right: 15px; }
  </style>
</head>
<body>
  <h2>Prody Productivity App</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
