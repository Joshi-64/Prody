{% extends 'base.html' %}
{% block content %}
<div class="card">
  <p>
    <a href="{{ url_for('dashboard') }}">Dashboard</a> | 
    <a href="{{ url_for('calendar_bp.view_calendar') }}">My Calendar</a> | 
    <a href="{{ url_for('user_courses_bp.add_courses') }}">Add Courses/Deadlines</a> | 
    <a href="{{ url_for('tasks_bp.manage_tasks') }}">Tasks</a> | 
    <a href="{{ url_for('logout') }}">Log Out</a>
  </p>
  <hr>
  <h3>Registered Users</h3>
  <table border="1" cellpadding="6" style="width:100%; border-collapse: collapse;">
    <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Created At</th></tr>
    {% for u in users %}
      <tr>
        <td>{{ u['id'] }}</td>
        <td>{{ u['username'] }}</td>
        <td>{{ u['email'] }}</td>
        <td>{{ u['role'] }}</td>
        <td>{{ u['created_at'] }}</td>
      </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
